<template>
  <section
    aria-labelledby="progress-heading"
    aria-live="polite"
    aria-atomic="true"
  >
    <h2 id="progress-heading" class="slds-text-heading_small">
      {label.ProgressTitle}
    </h2>
    <p class="slds-m-vertical_small">{message}</p>
    <lightning-progress-bar
      value={progress}
      size="large"
    ></lightning-progress-bar>
    <template lwc:if={isTerminal}>
      <lightning-button
        class="slds-m-top_small"
        label={label.StartAnother}
        onclick={handleReset}
      ></lightning-button>
    </template>
  </section>
</template>
